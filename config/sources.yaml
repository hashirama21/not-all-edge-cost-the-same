# Configuration des sources. Les gabarits d'URL viennent d'URL publiques observées
# (moteurs de recherche, octobre 2026) ; les sélecteurs CSS sont des valeurs de départ
# à vérifier avec `cmrmp discover <url>` avant une collecte massive.

politeness:
  min_delay_s: 3.0          # délai minimal entre deux requêtes vers un même hôte
  jitter_s: 1.5
  timeout_s: 60
  max_retries: 5
  respect_robots: true
  # Plages horaires de collecte (heure de Yaoundé, UTC+1) : éviter les heures de bureau.
  preferred_hours: [19, 7]

katika:
  base_url: "https://katika237.com"
  # Exemple observé : /tender/?o=&page=12&r=SERVICES+CENTRAUX&sort=date&type=&y=2023
  list_url: "https://katika237.com/tender/?o=&page={page}&r={region}&sort=date&type={type}&y={year}"
  years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  regions: [""]             # "" = toutes ; sinon "SERVICES CENTRAUX", "CENTRE", ...
  types: [""]               # "" = tous les types d'avis
  max_pages: 2000
  # Katika applique un rate-limit agressif (429) : cadence plus lente que la politesse globale.
  min_delay_s: 10.0
  jitter_s: 4.0
  max_retries: 6
  item_selectors: ["div.tender-entry", "table tbody tr", "div.card", "li.list-group-item", "article"]
  detail_link_regex: "/tender/[^?#]+"
  # Les documents passent par PRIDESOFT : « 0903_publications_dl?type_publication=…&id_publication=… »
  document_link_regex: "\\.(pdf|docx?|xlsx?)(\\?|$)|_dl\\?type_publication="

armp:
  # `armp.cm` (sans www) est instable : toujours passer par www.
  base_url: "https://www.armp.cm"
  # Moteur paginé (10 avis/page) : AO 48 464 pubs, DC 11 179, total ~146 610.
  # Filtres GET : type_publication[], reference_avis, maitre_ouvrage, region,
  # departement, seuil_marches (1..4), rechercher_parmi (1/2).
  search_url: "https://www.armp.cm/recherche_avancee"
  # Tableau de bord filtrable : exercice, type_procedure, nature_prestation,
  # type_maitre_ouvrage, region, etat_du_projet, seuil, tableau_de_bord,
  # periode_recours (pages /filtres et /filtres_avancee).
  discover_url: "https://www.armp.cm/filtres?type=avis&val=0&exercice=2025"
  # Couverture décennale : /filtres_avancee exige AU MOINS un filtre (sinon 0 résultat) ;
  # exercice 2017..2026 + type_procedure (1 AON, 5 DC, 12 AMI, 4 AOI, 7 DP, 21 AOR, 6 GAG).
  # Sondage réel (publications par exercice) : AON 6098 (2017) → 7384 (2026) ;
  # DC 1294 (2017) → 1883 (2026) ; 2016 contient déjà des publications.
  filtres_url: "https://www.armp.cm/filtres_avancee?filtre=avis&valeur_filtre=0"
  exercices: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  procedure_codes: [1, 5, 12, 4, 7, 21, 6]
  year_max_pages: 3          # pages de 10 avis par (exercice, type_procedure)
  # Exemple observé : /details?type_publication=DEC-ATTR&id_publication=22080
  detail_url: "https://www.armp.cm/details?type_publication={type}&id_publication={id}"
  sanctions_url: "https://www.armp.cm/sanctions"
  experts_url: "https://www.armp.cm/experts"
  experts_search_url: "https://www.armp.cm/experts_search"
  # Tous les codes connus du formulaire de recherche avancée.
  types: ["AO", "DC", "AMI", "DP", "ADDITIF", "DEC-ATTR", "DEC-ANN", "DEC-RES", "COMM", "CT"]
  seuil_marches: 1
  max_pages: 20
  listing_max_age_s: 1800
  # Collecte numérique de repli via /details (crawl_details).
  id_range: [1, 30000]
  stop_after_consecutive_missing: 400

pridesoft:
  base_url: "https://pridesoft.armp.cm"
  # Exemple observé : /0903_publications_report_appel_offres/index.php?type_avis=AO&id=6990&affichehtml=0
  report_url: "https://pridesoft.armp.cm/0903_publications_report_appel_offres/index.php?type_avis={type}&id={id}&affichehtml={html}"
  types: ["AO"]
  id_range: [1, 20000]
  stop_after_consecutive_missing: 400
  # Documents : /_lib/file/doc/0903/AAAA/MM/JJ/ENTITE/fichier.pdf
  document_path_regex: "/_lib/file/doc/0903/(\\d{4})/(\\d{2})/(\\d{2})/([^/]+)/"

jdm:
  # Le chemin « AbonnesJDM » suggère un espace abonnés. N'activer que si vous avez
  # un abonnement ou une autorisation de l'ARMP.
  enabled: false
  pdf_url: "https://armp.cm/AbonnesJDM/Jdm{num}.pdf"
  num_range: [1, 3500]

minmap:
  base_url: "https://minmap.cm"
  # Le site est un Joomla : recherche publique via com_finder (repli si l'API WP est fermée).
  wp_api: "https://minmap.cm/wp-json/wp/v2/posts"
  finder_url: "https://minmap.cm/index.php?option=com_finder&view=search&lang=fr"
  search_terms: ["exclu", "exclusion", "suspend", "sanction", "résiliation", "mise en demeure", "liste rouge"]

coleps:
  # Portail transactionnel JSP (marchespublics.cm / publiccontracts.cm).
  # Le parcours HTTP déterministe est le mode par défaut ; l'agent/Playwright reste disponible.
  start_urls: ["https://www.marchespublics.cm", "https://www.publiccontracts.cm"]
  allowed_domains: ["marchespublics.cm", "*.marchespublics.cm", "publiccontracts.cm", "*.publiccontracts.cm"]
  base_url: "https://www.marchespublics.cm"
  notice_form_url: "https://www.marchespublics.cm/pt/notice/movePtNoticeOpt.do?menuId=PT01010200"
  list_path: "/pt/notice/selectListPagePtNoticeOpt.do"
  detail_path: "/pt/notice/selectPtNoticeOpt.do"
  download_path: "/co/file/downloadFile.do"
  page_size: 50
  categories: [""]          # "" = toutes ; sinon "03", "05", "06", "07", "08"
  max_pages: 500
  min_delay_s: 3.0
  jitter_s: 1.5
  max_retries: 5
  # Les deux portails présentent un certificat incomplet / un nom d'hôte non conforme.
  insecure_tls: true

agent:
  # Modèle de l'agent browser-use. « llamacpp » : serveur llama.cpp local (API compatible
  # OpenAI) lancé par scripts/llama_server.sh ; « anthropic » : Claude (ANTHROPIC_API_KEY).
  # Variables prioritaires : CMRMP_AGENT_BACKEND, LLAMA_BASE_URL, CMRMP_AGENT_MODEL, CMRMP_AGENT_VISION.
  backend: llamacpp
  base_url: "http://127.0.0.1:8080/v1"
  model: "local"                  # alias donné au modèle par llama-server (--alias)
  anthropic_model: "claude-opus-5-5"
  use_vision: false               # true seulement avec un GGUF multimodal (fichier mmproj)
  flash_mode: true                # pas de raisonnement intermédiaire : moins de jetons sur CPU
  max_actions_per_step: 3
  llm_timeout_s: 900              # un pas d'agent sur CPU peut prendre plusieurs minutes
  step_timeout_s: 1200
  max_completion_tokens: 4096

costs:
  # Coût d'opportunité annuel de la caution immobilisée (taux débiteur indicatif CEMAC).
  caution_rate_annual: 0.12
  # Durée d'immobilisation par défaut si la validité de l'offre n'est pas lue (jours).
  caution_days_default: 120
  # Coût de montage d'une offre, en part du montant de l'offre (hypothèse à calibrer).
  bid_preparation_share: 0.005
  # Frais de création d'entreprise (CFCE, FCFA, à vérifier) et délai en jours.
  company_creation_fcfa: 41500
  company_creation_days: 3
  # Modification statutaire (changement de gérant), frais notariaux + greffe (hypothèse).
  statute_change_fcfa: 250000

dgi:
  # Consultation publique du fichier des contribuables (ASP.NET WebForms).
  # L'adresse fiscalis vient de la demande ; teledeclaration-dgi.cm est citée par des guides tiers.
  consultation_urls:
    - "http://fiscalis.dgi.cm/modules/immatriculation/Consultation/listecontribuable.aspx"
    - "https://teledeclaration-dgi.cm/modules/immatriculation/Consultation/listecontribuable.aspx"
  # Champ texte utilisé pour la recherche par préfixe (raison sociale), repéré par son nom ou id.
  search_field_regex: "raison|nom|denomination|libelle|^rs|search|recherche|texte"
  niu_field_regex: "niu|nui|identifiant"
  submit_regex: "recherch|search|valider|ok|afficher|consulter"
  export_regex: "export|excel|xls|csv|pdf|t[ée]l[ée]charg"
  # Préfixes de départ ; un préfixe dont les résultats paraissent tronqués est raffiné d'une lettre.
  alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  max_prefix_len: 4
  result_cap_hint: 1000          # au-delà, on suppose une troncature et on raffine le préfixe
  max_pages_per_query: 2000
  # Listes officielles publiées en PDF (tableaux extraits avec PyMuPDF).
  official_files:
    - url: "https://www.impots.cm/sites/default/files/documents/INACTIFS%20A%20PUBLIER%20_FINAL.pdf"
      statut: "inactif"
      date_reference: "2026-02-01"
    - url: "https://minfi.gov.cm/wp-content/uploads/2021/02/ENTREES-SORTIES_10-02-2021.pdf"
      statut: "entrees_sorties_depense_publique"
      date_reference: "2021-02-10"
  official_pages:
    - "https://www.impots.cm/fr/fichier-des-contribuables"
    - "https://www.impots.cm/fr/documents"
  # Publication : les personnes physiques (NIU en P…) sont pseudonymisées par défaut.
  keep_natural_persons: false
