[project]
name = "cmrmp"
version = "0.1.0"
description = "Collecte, extraction et publication des données de marchés publics camerounais (ARMP/PRIDESOFT, COLEPS, Katika237, MINMAP)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "tenacity>=9.0",
  "selectolax>=1.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.1",
  "rapidfuzz>=3.9",
  "typer>=0.12",
  "pyyaml>=6",
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "xlrd>=2.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.125"]
hf = ["huggingface_hub>=1.5"]          # buckets disponibles depuis 1.5
browser = ["playwright>=1.48"]
# browser-use épingle click==8.3.3, en conflit avec huggingface_hub récent :
# l'installer dans un environnement séparé (voir README).
agent = ["browser-use>=0.13"]
ocr = ["ocrmypdf>=16"]          # repli ; l'OCR principal passe par PyMuPDF + Tesseract (apt install tesseract-ocr-fra)
dev = ["pytest>=8"]

[project.scripts]
cmrmp = "cmrmp.cli:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
