name: agent-explore

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site à cartographier"
        default: "https://www.marchespublics.cm"
      max_steps:
        description: "Nombre maximal d'étapes de l'agent"
        default: "40"
      backend:
        description: "Modèle de l'agent"
        type: choice
        options: [llamacpp, anthropic]
        default: llamacpp

jobs:
  explore:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 340
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CMRMP_CONTACT: ${{ vars.CMRMP_CONTACT }}
      CMRMP_AGENT_BACKEND: ${{ github.event.inputs.backend }}
      LLAMA_BASE_URL: http://127.0.0.1:8080/v1
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      INPUT_URL: ${{ github.event.inputs.url }}
      INPUT_STEPS: ${{ github.event.inputs.max_steps }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installation (browser-use isolé)
        run: |
          pip install -e ".[agent,browser]"
          python -m playwright install --with-deps chromium
      - name: Modèle local llama.cpp
        if: github.event.inputs.backend == 'llamacpp'
        uses: ./.github/actions/llama-server
        with:
          model: ${{ vars.LLAMA_MODEL || 'unsloth/Qwen3.5-9B-GGUF:Q4_K_M' }}
          image: ${{ vars.LLAMA_IMAGE || 'ghcr.io/ggml-org/llama.cpp:server' }}
      - name: Vérification du modèle (santé + sortie structurée)
        if: github.event.inputs.backend == 'llamacpp'
        run: cmrmp agent check
      - name: Exploration
        run: timeout 320m cmrmp agent explore "$INPUT_URL" --out data/sitemaps/coleps.json --max-steps "$INPUT_STEPS"
      - name: Journal de llama-server
        if: failure() && github.event.inputs.backend == 'llamacpp'
        run: docker logs cmrmp-llama 2>&1 | tail -200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitemap
          path: data/sitemaps/
          if-no-files-found: ignore
