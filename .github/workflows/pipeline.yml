name: pipeline

on:
  schedule:
    - cron: "17 1 * * 0"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources à collecter (séparées par des virgules)"
        default: "katika,armp,pridesoft,minmap,coleps"
      years:
        description: "Années Katika (ex. 2018-2026)"
        default: "2018-2026"
      llm:
        description: "Extraction structurée par Claude"
        type: boolean
        default: true
      publish:
        description: "Publier sur Hugging Face"
        type: boolean
        default: true
      public:
        description: "Dataset public (sinon privé)"
        type: boolean
        default: false
      coleps_explore:
        description: "Cartographier COLEPS avec l'agent (auto : seulement sans carte)"
        type: choice
        options: [auto, always, never]
        default: auto

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  CMRMP_CONTACT: ${{ vars.CMRMP_CONTACT }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_BUCKET: ${{ vars.HF_BUCKET || 'krohn/cmr-marches-brut' }}
  HF_DATASET: ${{ vars.HF_DATASET || 'krohn/cmr-marches-publics' }}
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,hf]"
      - run: pytest -q

  crawl:
    needs: tests
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [katika, armp, pridesoft, minmap, coleps]
    steps:
      - name: Source sélectionnée ?
        id: sel
        run: |
          wanted="${{ github.event.inputs.sources || 'katika,armp,pridesoft,minmap,coleps' }}"
          if [[ ",$wanted," == *",${{ matrix.source }},"* ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.sel.outputs.run == 'true'
      - uses: actions/setup-python@v6
        if: steps.sel.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        if: steps.sel.outputs.run == 'true'
        run: |
          pip install -e ".[hf,browser]"
          if [ "${{ matrix.source }}" = "coleps" ]; then python -m playwright install --with-deps chromium; fi
      - name: Vérification Hugging Face
        if: steps.sel.outputs.run == 'true'
        run: scripts/step.sh "HF ${{ matrix.source }}" cmrmp hf check --bucket "$HF_BUCKET"
      - name: Cache depuis le bucket
        if: steps.sel.outputs.run == 'true'
        run: |
          extra=""
          if [ "${{ matrix.source }}" = "coleps" ]; then extra="--path sitemaps"; fi
          scripts/step.sh "Pull ${{ matrix.source }}" cmrmp hf pull --bucket "$HF_BUCKET" --path "raw/${{ matrix.source }}" --path "interim/${{ matrix.source }}" $extra
      # --- COLEPS : carte par l'agent browser-use, sur le modèle local llama.cpp ---------------
      - name: Carte COLEPS à produire ?
        id: map
        if: steps.sel.outputs.run == 'true' && matrix.source == 'coleps'
        run: |
          mode="${{ github.event.inputs.coleps_explore || 'auto' }}"
          # Une carte est utilisable si elle passe le schéma de l'agent (une sortie d'échec ne compte pas).
          valid=false
          for f in config/sitemaps/coleps.json data/sitemaps/coleps.json; do
            if [ -f "$f" ] && python -c "import sys; from cmrmp.sources.coleps import load_sitemap; load_sitemap(sys.argv[1])" "$f"; then valid=true; break; fi
          done
          if [ "$mode" = "always" ] || { [ "$mode" = "auto" ] && [ "$valid" = "false" ]; }; then
            echo "explore=true" >> "$GITHUB_OUTPUT"
          else
            echo "explore=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Installation de l'agent (environnement séparé, conflit click / huggingface_hub)
        if: steps.map.outputs.explore == 'true'
        run: |
          python -m venv .venv-agent
          .venv-agent/bin/pip install -e ".[agent,browser]"
          .venv-agent/bin/python -m playwright install --with-deps chromium
      - name: Modèle local llama.cpp
        if: steps.map.outputs.explore == 'true'
        uses: ./.github/actions/llama-server
        with:
          model: ${{ vars.LLAMA_MODEL || 'unsloth/Qwen3.5-9B-GGUF:Q4_K_M' }}
          image: ${{ vars.LLAMA_IMAGE || 'ghcr.io/ggml-org/llama.cpp:server' }}
      - name: Exploration COLEPS par l'agent
        if: steps.map.outputs.explore == 'true'
        env:
          CMRMP_AGENT_BACKEND: llamacpp
          LLAMA_BASE_URL: http://127.0.0.1:8080/v1
        run: |
          scripts/step.sh "Check llama" .venv-agent/bin/cmrmp agent check
          scripts/step.sh "Agent COLEPS" timeout 150m .venv-agent/bin/cmrmp agent explore --out data/sitemaps/coleps.json --max-steps "${{ vars.AGENT_MAX_STEPS || '40' }}"
          docker rm -f cmrmp-llama >/dev/null 2>&1 || true
          echo "CRAWL_TIMEOUT=160m" >> "$GITHUB_ENV"
      - name: Carte produite par l'agent (à relire puis versionner dans config/sitemaps/)
        if: always() && steps.map.outputs.explore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-coleps
          path: data/sitemaps/
          if-no-files-found: ignore
      # -----------------------------------------------------------------------------------------
      - name: Collecte
        if: steps.sel.outputs.run == 'true'
        run: |
          S="scripts/step.sh Collecte-${{ matrix.source }} timeout ${CRAWL_TIMEOUT:-320m}"
          case "${{ matrix.source }}" in
            katika)    $S cmrmp crawl katika --years "${{ github.event.inputs.years || '2018-2026' }}" ;;
            armp)      $S cmrmp crawl armp ;;
            pridesoft) $S cmrmp crawl pridesoft ;;
            minmap)    $S cmrmp crawl minmap ;;
            coleps)
              if [ -f config/sitemaps/coleps.json ] || [ -f data/sitemaps/coleps.json ]; then $S cmrmp crawl coleps
              else echo "::notice::aucune carte COLEPS : l'agent n'a rien produit (voir l'artefact sitemap-coleps)"; fi ;;
          esac
      - name: Envoi vers le bucket
        if: always() && steps.sel.outputs.run == 'true'
        run: |
          extra=""
          if [ "${{ matrix.source }}" = "coleps" ]; then extra="--path sitemaps"; fi
          scripts/step.sh "Push ${{ matrix.source }}" cmrmp hf push --bucket "$HF_BUCKET" --path "raw/${{ matrix.source }}" --path "interim/${{ matrix.source }}" $extra

  documents:
    needs: crawl
    if: always() && needs.crawl.result != 'cancelled'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[hf]"
      - run: scripts/step.sh "Pull documents" cmrmp hf pull --bucket "$HF_BUCKET" --path interim --path raw/docs
      - name: Téléchargement des documents
        run: scripts/step.sh "Documents" timeout 330m cmrmp crawl documents
      - if: always()
        run: scripts/step.sh "Push documents" cmrmp hf push --bucket "$HF_BUCKET" --path raw/docs

  build:
    needs: documents
    if: always() && needs.documents.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CMRMP_SALT: ${{ secrets.CMRMP_SALT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation (OCR compris)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ocrmypdf tesseract-ocr-fra
          pip install -e ".[hf,llm]"
      - run: scripts/step.sh "Pull build" cmrmp hf pull --bucket "$HF_BUCKET"
      - name: Extraction
        run: |
          if [ "${{ github.event.inputs.llm || 'true' }}" = "true" ]; then scripts/step.sh Extraction cmrmp extract --llm; else scripts/step.sh Extraction cmrmp extract; fi
      - name: Graphe, signaux, coûts
        run: scripts/step.sh Build cmrmp build
      - name: Audit de couverture
        run: scripts/step.sh Audit cmrmp audit
      - name: Cache vers le bucket
        if: always()
        run: scripts/step.sh "Push build" cmrmp hf push --bucket "$HF_BUCKET" --path text --path llm_cache --path interim/extract
      - name: Publication Hugging Face
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        run: |
          if [ "${{ github.event.inputs.public }}" = "true" ]; then scripts/step.sh Publication cmrmp hf publish --repo "$HF_DATASET" --public
          else scripts/step.sh Publication cmrmp hf publish --repo "$HF_DATASET"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports
          path: |
            data/reports/
            data/processed/er_paires_a_verifier.parquet
          if-no-files-found: ignore
